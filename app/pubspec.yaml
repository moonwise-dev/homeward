name: homeward
description: Homeward, a home-buying finance agent built on A2UI.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.3

resolution: workspace

dependencies:
  a2ui_core: 0.1.1
  common: ^0.1.0
  cupertino_icons: ^1.0.9
  firebase_app_check: ^0.4.8
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  genui: 0.10.3
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  hooks_riverpod: ^3.3.2
  http: ^1.6.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  json_schema_builder: 0.1.7
  latlong2: ^0.10.1
  riverpod_annotation: ^4.0.3
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  genui_a2a: ^0.10.1
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.4
  shelf: ^1.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/photos/
