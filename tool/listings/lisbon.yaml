city: lisbon
listings:
  - id: lis-01
    area: santo-antonio
    name: Príncipe Real
    address: Rua da Escola Politécnica 56
    title: A tall-ceilinged flat with a piano room
    blurb: Old parquet, tall windows, and a salon big enough for a piano, a block from the garden square.
    description: >-
      A second-floor flat in a 1905 building a block from the Príncipe Real
      garden. Old parquet floors, ceilings over three and a half metres, and a
      salon big enough for a grand piano, with two iron balconies onto the
      street. The two bedrooms face a quiet back garden. The building has no
      lift, and a wide wooden stair climbs from the entrance. The bathroom was
      renovated with a walk-in shower. A nook off the kitchen holds a desk.
    type: flat
    rooms: 3
    bedrooms: 2
    size: 105
    floor: 2
    year: 1905
    outdoor: balcony
    style: classic
    factor: 1.02
    photos: [lis-01-1, lis-01-2, lis-01-3]
  - id: lis-02
    area: misericordia
    name: Bica
    address: Rua de São Paulo 100
    title: A renovated one-bedroom with a green-tiled kitchen
    blurb: Oak floors, a green-tiled kitchen, and the river at the bottom of the street.
    description: >-
      A renovated one-bedroom on the third floor of a 1920 building in Santos,
      with the river at the bottom of the street. Oak floors run through, and
      the kitchen is tiled in green. A lift was added in the 2022 renovation,
      but the entrance is up four steps from the pavement. The shower is walk-
      in, behind a glass screen. The bedroom is quiet, at the back. The building
      allows pets.
    type: flat
    rooms: 2
    bedrooms: 1
    size: 58
    floor: 3
    year: 1920
    outdoor: none
    style: modern
    factor: 1.0
    photos: [lis-02-1, lis-02-2, lis-02-3, lis-02-4]
  - id: lis-03
    area: estrela
    name: Lapa
    address: Rua do Prior 40
    title: A river-view flat on a quiet slope
    blurb: A tall, quiet flat on the Lapa hill, with a balcony and the Tagus in the windows.
    description: >-
      A tall, quiet flat on the fourth floor of a 1910 building on the Lapa
      hill, with the Tagus in the windows. Three bedrooms, a long corridor of
      cupboards, and a living room that opens onto a balcony over the river. An
      old cage lift serves every floor, from an entrance hall up two marble
      steps. Both bathrooms have tubs. The third bedroom, by the kitchen, works
      as a home office.
    type: flat
    rooms: 4
    bedrooms: 3
    size: 135
    floor: 4
    year: 1910
    outdoor: balcony
    style: classic
    factor: 1.06
    photos: [lis-03-1, lis-03-2, lis-03-3]
  - id: lis-04
    area: campo-de-ourique
    name: Campo de Ourique
    address: Rua Ferreira Borges 100
    title: Parquet floors and French windows
    blurb: Double doors between the rooms and French windows, above the market streets.
    description: >-
      A 1935 flat on the third floor above the market streets of Campo de
      Ourique. Parquet floors, double doors between the rooms, and French
      windows onto a narrow balcony. Of the two bedrooms, the smaller is set up
      as a study. The building has no lift. The bathroom has a shower tray and
      was renewed in 2019. The market, the number 28 tram, and two schools are a
      few minutes' walk away.
    type: flat
    rooms: 3
    bedrooms: 2
    size: 92
    floor: 3
    year: 1935
    outdoor: balcony
    style: classic
    factor: 0.97
    photos: [lis-04-1, lis-04-2, lis-04-3, lis-04-4]
  - id: lis-05
    area: santa-maria-maior
    name: Alfama
    address: Rua de São Miguel 20
    title: A one-bedroom with a terrace over the river
    blurb: At the top of an old stair, a terrace looks over the rooftops to the river.
    description: >-
      A one-bedroom at the top of an 1890 building in Alfama, reached by a
      narrow stone stair of four flights; there is no lift. The reward is a
      terrace that looks over the rooftops to the river. The living room has
      exposed beams and a small kitchen along one wall, and the bedroom is up a
      short stair under the roof. The shower is walk-in.
    type: flat
    rooms: 2
    bedrooms: 1
    size: 60
    floor: 4
    year: 1890
    outdoor: balcony
    style: classic
    factor: 1.08
    photos: [lis-05-1, lis-05-2, lis-05-3]
  - id: lis-06
    area: sao-vicente
    name: Graça
    address: Rua da Graça 50
    title: A sunny two-bedroom on a tram street
    blurb: Light all day, the tram at the door, and the Graça viewpoint around the corner.
    description: >-
      A sunny two-bedroom on the second floor of a 1920 building on a tram
      street in Graça, with light all day. The living room opens onto a balcony,
      and the Graça viewpoint is around the corner. There is no lift; the stair
      is short and well lit. The kitchen keeps its original tiles, and the
      bathroom was renewed with a bath. The second bedroom is used as a study.
    type: flat
    rooms: 3
    bedrooms: 2
    size: 84
    floor: 2
    year: 1920
    outdoor: balcony
    style: classic
    factor: 0.94
    photos: [lis-06-1, lis-06-2, lis-06-3]
  - id: lis-07
    area: parque-das-nacoes
    name: Parque das Nações
    address: Avenida Dom João II 40
    title: A three-bedroom above the riverfront
    blurb: A kitchen that opens onto the balcony, high above the river promenade.
    description: >-
      A three-bedroom on the ninth floor of a 2004 building above the river
      promenade. The building is step-free from the street, with two lifts and a
      concierge. The kitchen opens onto a long balcony over the river. The main
      bedroom has its own bathroom with a walk-in shower, and a second bathroom
      has a tub. There is underground parking and a storage room. Pets are
      allowed.
    type: flat
    rooms: 4
    bedrooms: 3
    size: 128
    floor: 9
    year: 2004
    outdoor: balcony
    style: modern
    factor: 1.0
    photos: [lis-07-1, lis-07-2, lis-07-3, lis-07-4]
  - id: lis-08
    area: alvalade
    name: Alvalade
    address: Avenida da Igreja 20
    title: A 1950s family flat by the park
    blurb: Renovated, with built-in shelves, a family room, and schools and the park nearby.
    description: >-
      A 1950s family flat on the third floor in Alvalade, renovated in 2021.
      Built-in shelves line the living room, and a family room opens onto the
      balcony. The building has a lift, and a new ramp at the entrance makes it
      step-free. The bathroom has a walk-in shower. Schools and the park are a
      short walk away. The third bedroom is set up as an office.
    type: flat
    rooms: 4
    bedrooms: 3
    size: 112
    floor: 3
    year: 1954
    outdoor: balcony
    style: modern
    factor: 0.93
    photos: [lis-08-1, lis-08-2, lis-08-3]
  - id: lis-09
    area: carcavelos
    name: Carcavelos
    address: Avenida Jorge V
    town: Carcavelos
    title: A two-bedroom five minutes from the surf
    blurb: The sea from the balcony and the surf a short walk away.
    description: >-
      A two-bedroom on the fifth floor of a 2016 building, five minutes' walk
      from the surf at Carcavelos beach. The balcony looks over the sea. The
      building has a lift and a step-free entrance, and a storage room for
      boards and bikes. The main bathroom has a walk-in shower. The train to
      Lisbon is a ten-minute walk.
    type: flat
    rooms: 3
    bedrooms: 2
    size: 92
    floor: 5
    year: 2016
    outdoor: balcony
    style: modern
    factor: 1.0
    photos: [lis-09-1, lis-09-2, lis-09-3]
  - id: lis-10
    area: cascais-estoril
    name: Monte Estoril
    address: Avenida de Sabóia
    town: Estoril
    title: A white townhouse with a walled garden
    blurb: Arched rooms, wooden ceilings, and a walled garden above the bay.
    description: >-
      A white 1928 townhouse above the bay in Cascais, with arched rooms and
      wooden ceilings. The front door opens straight from the pavement. A walled
      garden with a lemon tree sits behind the house, a few steps down from the
      kitchen. The living rooms are on the ground floor, and all three bedrooms
      and both bathrooms are upstairs, reached by a tiled stair.
    type: house
    rooms: 4
    bedrooms: 3
    size: 168
    year: 1928
    outdoor: garden
    style: classic
    factor: 1.0
    photos: [lis-10-1, lis-10-2, lis-10-3]
  - id: lis-11
    area: costa-da-caparica
    name: Costa da Caparica
    address: Avenida General Humberto Delgado
    town: Costa da Caparica
    title: A beachfront flat facing the Atlantic
    blurb: The Atlantic fills the dining-room windows; the beach is across the road.
    description: >-
      A beachfront flat on the fourth floor of a 2018 building, with the
      Atlantic filling the dining-room windows and the beach across the road.
      The building has a lift from a step-free lobby. There are two bedrooms,
      the main one with its own bathroom and walk-in shower. A nook by the
      entrance fits a desk. Pets are not allowed in the building.
    type: flat
    rooms: 3
    bedrooms: 2
    size: 88
    floor: 4
    year: 2018
    outdoor: balcony
    style: modern
    factor: 1.03
    photos: [lis-11-1, lis-11-2, lis-11-3]
  - id: lis-12
    area: sintra
    name: Sintra
    address: Rua Visconde de Monserrate
    town: Sintra
    title: A tiled house in the hills below the palaces
    blurb: A fireplace, a white stair, and a big garden in the cool Sintra hills.
    description: >-
      A tiled house from 1900 in the cool hills below the Sintra palaces,
      reached by a stone stair from the lane. The ground floor has a fireplace
      room, the kitchen, and a dining room, and a white stair leads up to the
      four bedrooms. There is a bathroom on each floor, the lower one with a
      bath. The big garden is terraced down the hill, with camellias and an old
      water tank.
    type: house
    rooms: 5
    bedrooms: 4
    size: 230
    year: 1900
    outdoor: garden
    style: classic
    factor: 0.95
    photos: [lis-12-1, lis-12-2, lis-12-3]
  - id: lis-13
    area: carcavelos
    name: Parede
    address: Avenida da República
    town: Parede
    title: A new villa with a pool near the beach
    blurb: A pool, a lawn, and open living rooms, a short walk from the beach.
    description: >-
      A new villa from 2021, a short walk from Carcavelos beach. The house is
      entered without steps from the drive, and its open living rooms give onto
      a lawn and a pool. A bedroom suite on the ground floor has a walk-in
      shower, and three more bedrooms are upstairs. There is a garage for two
      cars.
    type: house
    rooms: 5
    bedrooms: 4
    size: 210
    year: 2021
    outdoor: garden
    style: modern
    factor: 1.02
    photos: [lis-13-1, lis-13-2, lis-13-3]
  - id: lis-14
    area: cascais-estoril
    name: Cascais
    address: Rua Frederico Arouca
    town: Cascais
    title: A white house on the hill above the bay
    blurb: A roof terrace, breakfast on the balcony, and the old town down the hill.
    description: >-
      A white 1965 house on the hill above the bay, with the old town down the
      hill. From the street, steps climb through the garden to the front door.
      Inside, the living room and kitchen lead to a balcony for breakfast, and a
      stair goes up to a roof terrace. The three bedrooms share one bathroom
      with a bath. The garden is planted with olive trees.
    type: house
    rooms: 4
    bedrooms: 3
    size: 160
    year: 1965
    outdoor: garden
    style: modern
    factor: 0.98
    photos: [lis-14-1, lis-14-2, lis-14-3]
