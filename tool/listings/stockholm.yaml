city: stockholm
listings:
  - id: sto-01
    area: vasastan
    name: Odengatan
    address: Odengatan 64
    title: A bright corner flat above Vasaparken
    blurb: Three rooms with tall windows, a tiled stove, and a balcony over the park.
    description: >-
      A corner flat on the fourth floor of a 1911 building on Odengatan, with
      tall windows on two sides and Vasaparken below. The living room keeps its
      tiled stove and plaster cornices, and the two bedrooms face the quiet
      courtyard. The kitchen was renovated in 2019 and has room for a table of
      six. The bathroom has a tub with a shower over it. A small lift runs from
      the half-landing, so there are six steps up from the street door before
      you reach it. The balcony faces the park and takes the evening sun. The
      association allows pets and has a bicycle room in the courtyard.
    type: flat
    rooms: 3
    bedrooms: 2
    size: 78
    floor: 4
    year: 1911
    outdoor: balcony
    style: classic
    factor: 0.98
    photos: [sto-01-1, sto-01-2, sto-01-3, sto-01-4]
  - id: sto-02
    area: vasastan
    name: Dalagatan
    address: Dalagatan 32
    title: Two light rooms with a sleeping loft
    blurb: High ceilings, an arched window onto the street, and a loft for the bed.
    description: >-
      Two light rooms on the third floor of a 1904 stone building on Dalagatan.
      Ceilings of almost four metres made room for a sleeping loft above the
      kitchen, reached by a steep ladder stair, which leaves the room below free
      for a desk by the arched window. The bathroom was tiled in 2021 and has a
      walk-in shower. There is no lift; the stairwell is wide and bright, with a
      window on every landing. Laundry and storage are in the cellar. Dogs and
      cats are welcome in the association.
    type: flat
    rooms: 2
    bedrooms: 1
    size: 56
    floor: 3
    year: 1904
    outdoor: none
    style: classic
    factor: 1.02
    photos: [sto-02-1, sto-02-2, sto-02-3]
  - id: sto-03
    area: ostermalm
    name: Karlavägen
    address: Karlavägen 58
    title: A grand top-floor flat with a spiral stair
    blurb: Arched windows, a stair to a roof room, and a balcony above the lime trees of Karlavägen.
    description: >-
      The top floor of an 1890 building on Karlavägen, with arched windows above
      the lime trees. Three bedrooms, a dining room with parquet and a tiled
      stove, and a spiral stair up to a roof room that works as a study. A lift
      from the entrance hall goes all the way to the fifth floor, and the
      entrance is level with the pavement. The main bathroom has a bath and a
      separate walk-in shower, and a guest toilet sits by the front door. The
      balcony faces the avenue. The association does not allow pets.
    type: flat
    rooms: 4
    bedrooms: 3
    size: 118
    floor: 5
    year: 1890
    outdoor: balcony
    style: classic
    factor: 1.05
    photos: [sto-03-1, sto-03-2, sto-03-3]
  - id: sto-04
    area: sodermalm
    name: Sankt Paulsgatan
    address: Sankt Paulsgatan 21
    title: Three rooms on the hill above the water
    blurb: Open shelving and warm wood, with Mariatorget and its cafés down the street.
    description: >-
      Three rooms on the third floor of a 1925 building on the hill above
      Mariatorget. Open shelving and warm pine floors run through the flat, and
      the kitchen looks down over the trees of the square. The two bedrooms face
      the courtyard, and one is just big enough for a desk under the window. The
      bathroom has a shower cabinet and a washing machine. The building has no
      lift, and the stairs up from the street are steep. Cafés, the metro, and
      the waterfront at Söder Mälarstrand are a few minutes' walk away.
    type: flat
    rooms: 3
    bedrooms: 2
    size: 72
    floor: 3
    year: 1925
    outdoor: none
    style: classic
    factor: 0.96
    photos: [sto-04-1, sto-04-2, sto-04-3]
  - id: sto-05
    area: kungsholmen
    name: Norr Mälarstrand
    address: Norr Mälarstrand 30
    title: A 1930s flat with a glazed balcony
    blurb: Herringbone floors, two bedrooms, and the waterside walk two minutes away.
    description: >-
      A 1934 functionalist flat on the third floor, a block from the Norr
      Mälarstrand waterside walk. Herringbone oak floors, two bedrooms, and a
      living room that opens onto a glazed balcony. The lift was replaced in
      2020 and stops at every floor, and a ramp runs beside the three steps at
      the front door. The bathroom has a bath and no separate shower. A small
      study alcove opens off the hall. The association allows pets, and the
      courtyard has a playground.
    type: flat
    rooms: 3
    bedrooms: 2
    size: 81
    floor: 3
    year: 1934
    outdoor: balcony
    style: modern
    factor: 0.99
    photos: [sto-05-1, sto-05-2, sto-05-3]
  - id: sto-06
    area: solna
    name: Arenastaden
    address: Evenemangsgatan 21
    town: Solna
    title: A new-build four-room flat with a big balcony
    blurb: An open kitchen, three bedrooms, and a south-west balcony over the rooftops.
    description: >-
      A four-room flat on the sixth floor of a 2021 building near Solna station.
      The entrance, the lift, and the flat's own door are all step-free, and the
      lift is large enough for a wheelchair. An open kitchen and living room
      lead to a south-west balcony over the rooftops. There are three bedrooms,
      one of them next to the bathroom, which has a walk-in shower with a fold-
      down seat. A second bathroom has a tub. The association welcomes pets and
      has a shared roof terrace and a bicycle garage.
    type: flat
    rooms: 4
    bedrooms: 3
    size: 96
    floor: 6
    year: 2021
    outdoor: balcony
    style: modern
    factor: 1.04
    photos: [sto-06-1, sto-06-2, sto-06-3, sto-06-4]
  - id: sto-07
    area: solna
    name: Bergshamra
    address: Björnstigen 83
    town: Solna
    title: A family house at the edge of the woods
    blurb: Vaulted ceilings, an open kitchen, and the Ulriksdal woods at the end of the garden.
    description: >-
      A 2012 family house at the edge of the Ulriksdal woods, built on one and a
      half floors. The front door is level with the paved path from the drive.
      On the entry floor are the open kitchen and living room under a vaulted
      ceiling, a bedroom, and a bathroom with a walk-in shower; three more
      bedrooms and a family bathroom are upstairs. A small home office with its
      own window sits off the hall. The garden runs down to the woods, with a
      deck on the south side and two parking places on the drive.
    type: house
    rooms: 5
    bedrooms: 4
    size: 142
    year: 2012
    outdoor: garden
    style: modern
    factor: 0.95
    photos: [sto-07-1, sto-07-2, sto-07-3, sto-07-4]
  - id: sto-08
    area: danderyd
    name: Vasavägen
    address: Vasavägen 30
    town: Stocksund
    title: A 1912 villa with a garden all the way round
    blurb: A carved wooden villa, carefully restored, with a formal dining room and a stair to five bedrooms.
    description: >-
      A carved wooden villa from 1912, restored with care, on a large plot with
      a garden all the way round. A flight of stone steps leads up to the
      veranda and the front door. The ground floor holds a formal dining room, a
      drawing room with a tiled stove, a kitchen with a pantry, and a guest
      toilet; all five bedrooms and both bathrooms are up the main stair. The
      cellar has a sauna and a workshop. Danderyd's schools and the Mörby centre
      are a short bike ride away.
    type: house
    rooms: 6
    bedrooms: 5
    size: 190
    year: 1912
    outdoor: garden
    style: classic
    factor: 1.03
    photos: [sto-08-1, sto-08-2, sto-08-3]
  - id: sto-09
    area: danderyd
    name: Stocksund
    address: Edsviksvägen 20
    town: Danderyd
    title: A pink 1920s villa near the schools
    blurb: A plastered villa with a wood stove in the living room, and schools you can walk to.
    description: >-
      A pink plastered villa from 1927 on a quiet street, a walk from Danderyd's
      schools. A ramp runs up beside the front steps, added for the previous
      owner, so the house can be entered without steps. The ground floor has a
      living room with a wood stove, the kitchen, and a bedroom with a shower
      room next to it, with a walk-in shower. Three more bedrooms are upstairs.
      A glazed veranda looks over an old apple garden. The garage has been
      turned into a study with its own door.
    type: house
    rooms: 5
    bedrooms: 4
    size: 158
    year: 1927
    outdoor: garden
    style: classic
    factor: 0.92
    photos: [sto-09-1, sto-09-2, sto-09-3]
  - id: sto-10
    area: lidingo
    name: Lidingö
    address: Kottlavägen 90
    town: Lidingö
    title: A yellow villa on the rocks by the water
    blurb: A living room above the pines, an attic bedroom, and a path down to the water.
    description: >-
      A yellow 1935 villa on the rocks above the water, reached from the road by
      forty steps through the pines. The living room sits high above the trees,
      with the kitchen and a small bedroom beside it, and the other three
      bedrooms are in the attic under the eaves. There is a bathroom on each
      floor, both with tubs. A path leads down through the garden to a shared
      jetty. The house is ten minutes by car from Lidingö centre and the Ropsten
      metro.
    type: house
    rooms: 6
    bedrooms: 4
    size: 176
    year: 1935
    outdoor: garden
    style: classic
    factor: 1.07
    photos: [sto-10-1, sto-10-2, sto-10-3]
  - id: sto-11
    area: bromma
    name: Äppelviken
    address: Äppelviksvägen 40
    town: Bromma
    title: A red wooden house with a porch
    blurb: A wood stove, a country kitchen, and a porch on a street of gardens.
    description: >-
      A red wooden house from 1931 on a street of gardens in Bromma. Three steps
      lead up to the porch, where you can sit and watch the street. Inside are a
      country kitchen with a wood stove, a living room, and a bedroom on the
      ground floor; two more bedrooms and the bathroom are upstairs. The ground
      floor has only a toilet and a laundry room. The garden has fruit trees and
      a playhouse, and it is fenced all the way round.
    type: house
    rooms: 5
    bedrooms: 3
    size: 148
    year: 1931
    outdoor: garden
    style: classic
    factor: 0.97
    photos: [sto-11-1, sto-11-2, sto-11-3]
  - id: sto-12
    area: nacka
    name: Järla sjö
    address: Järla Gårdsväg 12
    town: Nacka
    title: A loft-style flat by the lake
    blurb: A spiral stair to a sleeping loft, with the trails around Järlasjön outside.
    description: >-
      A loft-style flat on the fifth floor of a 2019 building by Järlasjön. The
      living room rises two storeys, and a spiral stair leads to a sleeping
      loft; the second bedroom is on the entry level. The building is step-free
      from the street, with a lift to every floor. The bathroom has a walk-in
      shower and underfloor heating. The balcony looks over the lake and the
      trails of the Nacka nature reserve. The association allows pets.
    type: flat
    rooms: 3
    bedrooms: 2
    size: 77
    floor: 5
    year: 2019
    outdoor: balcony
    style: modern
    factor: 0.95
    photos: [sto-12-1, sto-12-2, sto-12-3]
  - id: sto-13
    area: sundbyberg
    name: Lötsjön
    address: Lötsjövägen 10
    town: Sundbyberg
    title: An orange wooden house with a flower garden
    blurb: A vaulted living room and a garden of flowers, near the commuter train.
    description: >-
      An orange wooden house from 1918 with a flower garden, five minutes from
      the commuter train. The living room has a vaulted ceiling and doors to the
      garden, and the kitchen was renewed in 2018. All three bedrooms and the
      bathroom are on the upper floor, under a steep roof. The cellar holds a
      laundry and storage. The garden has perennial beds, a greenhouse, and a
      gate onto a footpath to the school.
    type: house
    rooms: 4
    bedrooms: 3
    size: 118
    year: 1918
    outdoor: garden
    style: classic
    factor: 0.94
    photos: [sto-13-1, sto-13-2, sto-13-3]
  - id: sto-14
    area: liljeholmen
    name: Liljeholmskajen
    address: Liljeholmsstranden 3
    title: Two rooms on the waterfront
    blurb: A compact kitchen, a quiet bedroom, and a balcony over the water.
    description: >-
      Two rooms on the seventh floor of a 2016 building on the Liljeholmen
      waterfront. The whole building is step-free, with two lifts from the
      entrance hall. A compact kitchen opens onto the living room and a balcony
      over the water, and the bedroom faces the quiet side. The bathroom has a
      walk-in shower and a washing machine. The metro and the tram stop are
      across the square. Pets are allowed.
    type: flat
    rooms: 2
    bedrooms: 1
    size: 58
    floor: 7
    year: 2016
    outdoor: balcony
    style: modern
    factor: 1.0
    photos: [sto-14-1, sto-14-2, sto-14-3]
