id: change-down-payment
persona: cross-border
turns:
  - text: >-
      I live in Stockholm and want a two-bedroom flat in Funchal, around
      350 000 euro
    expect:
      tools_called: [resolve_market, load_market]
      tools_allowed: [propose_profile, propose_scenario, get_obstacles]
      market: PT-30
  - action: commit_profile
    data:
      profile:
        age: 42
        borrowers: 1
        adults: 2
        childAges: []
        employment: employed
        citizenship: SE
        taxResidence: SE
        formerResident: false
        residencyIntent: becomeResident
        use: secondary
        netMonthlyIncome: { minorUnits: 6000000, currency: SEK }
        monthlyDebtPayments: { minorUnits: 0, currency: SEK }
        savings: { minorUnits: 170000000, currency: SEK }
    expect:
      tools_allowed:
        [compute_affordability, propose_scenario, estimate_purchase_costs, get_obstacles, load_market]
      components_include: [AmountSlider]
  - action: commit_scenario
    data:
      scenario:
        price: { minorUnits: 35000000, currency: EUR }
        downPayment: { minorUnits: 12000000, currency: EUR }
    expect:
      tools_allowed:
        [compute_affordability, estimate_purchase_costs, get_obstacles, load_market]
      binding_constraint: debtServiceToIncome
