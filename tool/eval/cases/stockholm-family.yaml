id: stockholm-family
persona: relocating-family
buyer:
  place: KTH
  placePoint: { lat: 59.3498, lng: 18.0707 }
  adults: 2
  childAges: [6, 9]
  mode: bike
  maxMinutes: 25
  homeType: house
  outdoor: garden
  style: classic
  rooms: 5
  areas: [danderyd, solna, lidingo]
turns:
  - reason: study
    text: >-
      Reason for the move: studies.

      Moving to: Stockholm.
    expect:
      tools_called: [propose_story]
      tools_allowed: [resolve_market]
      market: SE
      coverage: curated
      components_exclude:
        [
          StoryDraft,
          ComparisonTable,
          DynamicRecommendationStack,
          AffordabilitySummary,
        ]
  - answer: until_summary
    expect:
      tools_allowed: [propose_story, compare_areas, resolve_market]
      components_exclude:
        [ComparisonTable, DynamicRecommendationStack, AffordabilitySummary]
  - action: commit_story
    data:
      story:
        picks:
          schools: [schools]
          activities: [parks]
          evenings: [quiet]
        mustHaves: [schools]
    expect:
      tools_allowed: [propose_story, propose_profile]
      components_include: [LifestyleCommuteMap, DynamicRecommendationStack]
  - action: choose_home
    tapped:
      candidateId: c1
    expect:
      tools_allowed: [load_market, propose_profile, propose_scenario]
      market: SE
      components_exclude: [ComparisonTable, MarketSnapshotCard]
  - action: commit_profile
    data:
      profile:
        adults: 2
        childAges: [6, 9]
        age: 38
        borrowers: 2
        employment: employed
        citizenship: SE
        taxResidence: SE
        use: primary
        firstTime: true
        netMonthlyIncome: { minorUnits: 8400000, currency: SEK }
        grossMonthlyIncome: { minorUnits: 12000000, currency: SEK }
        monthlyDebtPayments: { minorUnits: 0, currency: SEK }
        savings: { minorUnits: 600000000, currency: SEK }
    expect:
      tools_allowed: [compute_affordability, propose_scenario, load_market]
      market: SE
      components_include:
        [
          AffordabilitySummary,
          AmountSlider,
          PaymentBreakdown,
          StressTestChart,
          PurchaseCostsTable,
        ]
  - action: commit_scenario
    data:
      scenario:
        downPayment: { minorUnits: 600000000, currency: SEK }
    expect:
      tools_allowed:
        [compute_affordability, estimate_purchase_costs, get_obstacles, load_market]
