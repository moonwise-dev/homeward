id: stockholm-family
persona: relocating-family
turns:
  - reason: study
    text: >-
      Reason for the move: studies.

      Moving to: Stockholm.
    expect:
      tools_called: [propose_story]
      tools_allowed: [resolve_market, propose_profile, load_market]
      market: SE
      coverage: curated
      components_exclude:
        [ComparisonTable, AffordabilitySummary, DynamicRecommendationStack]
  - text: >-
      KTH, starting in January. We're looking at a flat on Odengatan for 7.4
      million and one in Solna for 5.2 million.
    expect:
      tools_called: [propose_story]
      tools_allowed: [resolve_market, propose_profile, load_market]
      market: SE
      coverage: curated
      components_include: [LifestyleCommuteMap, ChoicePicker]
      components_exclude: [ComparisonTable, AffordabilitySummary]
  - action: continue_story
    data:
      story:
        mode: [bike]
        maxMinutes: 20
    expect:
      tools_allowed: [propose_story, load_market, propose_profile]
      components_include: [ChoicePicker]
      components_exclude: [ComparisonTable, AffordabilitySummary]
  - action: continue_story
    data:
      story:
        picks:
          schools: [schools]
          activities: [parks, gym]
          evenings: [quiet]
          gettingAround: [transit]
    expect:
      tools_allowed: [propose_story, load_market, propose_profile]
      components_include: [ChoicePicker]
      components_exclude: [ComparisonTable, AffordabilitySummary]
  - action: commit_story
    data:
      story:
        mustHaves: [commute, schools]
    expect:
      tools_allowed: [propose_story, load_market, propose_profile]
      components_include:
        [LifestyleCommuteMap, ComparisonTable, DynamicRecommendationStack]
  - action: choose_home
    tapped:
      candidateId: c1
    expect:
      tools_allowed: [load_market, propose_profile, propose_scenario]
      market: SE
      components_exclude: [ComparisonTable, MarketSnapshotCard]
  - action: commit_profile
    data:
      profile:
        adults: 2
        childAges: [6, 9]
        age: 38
        borrowers: 2
        employment: employed
        citizenship: SE
        taxResidence: SE
        use: primary
        firstTime: true
        netMonthlyIncome: { minorUnits: 8400000, currency: SEK }
        monthlyDebtPayments: { minorUnits: 0, currency: SEK }
        savings: { minorUnits: 120000000, currency: SEK }
    expect:
      tools_allowed: [compute_affordability, propose_scenario, load_market]
      market: SE
      components_include:
        [
          AffordabilitySummary,
          AmountSlider,
          PaymentBreakdown,
          StressTestChart,
          PurchaseCostsTable,
        ]
