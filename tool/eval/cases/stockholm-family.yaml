id: stockholm-family
persona: relocating-family
buyer:
  place: KTH
  placePoint: { lat: 59.3498, lng: 18.0707 }
  adults: 3
  childAges: [6, 9]
  needs: [stepFree, entryLevelShower]
  routine:
    - { label: KTH, perWeek: 3 }
    - { label: The clinic, perWeek: 1, point: { lat: 59.3924, lng: 18.0395 } }
  mode: bike
  maxMinutes: 25
  homeType: house
  outdoor: garden
  style: classic
  rooms: 5
  areas: [danderyd, solna, lidingo]
turns:
  - reason: study
    text: >-
      Reason for the move: studies.

      Moving to: Stockholm.
    expect:
      tools_called: [propose_story]
      tools_allowed: [resolve_market]
      market: SE
      coverage: curated
      components_exclude:
        [
          StoryDraft,
          ComparisonTable,
          DynamicRecommendationStack,
          AffordabilitySummary,
        ]
  - answer: until_summary
    expect:
      tools_allowed: [propose_story, compare_areas, resolve_market]
      components_exclude:
        [ComparisonTable, DynamicRecommendationStack, AffordabilitySummary]
  - action: commit_story
    data:
      story:
        picks:
          schools: [schools]
          activities: [parks]
          evenings: [quiet]
        mustHaves: [schools]
    expect:
      tools_allowed: [propose_story, propose_profile]
      components_include: [LifestyleCommuteMap, DynamicRecommendationStack]
  - action: choose_home
    tapped:
      candidateId: c1
    expect:
      tools_allowed: []
      components_include: [LifestyleCommuteMap]
      components_exclude: [ComparisonTable, MarketSnapshotCard, MoneyInput]
