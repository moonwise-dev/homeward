id: stockholm-family
persona: relocating-family
turns:
  - reason: study
    text: >-
      Reason for the move: studies.

      Moving to: Stockholm.
    expect:
      tools_called: [propose_story]
      tools_allowed: [resolve_market, propose_profile]
      market: SE
      coverage: curated
      components_include: [StoryDraft, LifestyleCommuteMap]
      components_exclude:
        [
          ChoicePicker,
          ComparisonTable,
          AffordabilitySummary,
          DynamicRecommendationStack,
        ]
  - text: >-
      I start at KTH in January. We have two kids, six and nine, and we're
      weighing a flat on Odengatan for 7.4 million and one in Solna for 5.2
      million.
    expect:
      tools_called: [propose_story]
      tools_allowed: [resolve_market, propose_profile]
      market: SE
      components_include: [StoryDraft, LifestyleCommuteMap]
      components_exclude: [ComparisonTable, AffordabilitySummary]
  - action: commit_story
    data:
      story:
        mode: [bike]
        maxMinutes: 20
        picks:
          schools: [schools]
          activities: [parks, gym]
          evenings: [quiet]
          gettingAround: [transit]
        mustHaves: [commute, schools]
    expect:
      tools_allowed: [propose_story, propose_profile]
      components_include:
        [LifestyleCommuteMap, ComparisonTable, DynamicRecommendationStack]
  - action: choose_home
    tapped:
      candidateId: c1
    expect:
      tools_allowed: [load_market, propose_profile, propose_scenario]
      market: SE
      components_exclude: [ComparisonTable, MarketSnapshotCard]
  - action: commit_profile
    data:
      profile:
        adults: 2
        childAges: [6, 9]
        age: 38
        borrowers: 2
        employment: employed
        citizenship: SE
        taxResidence: SE
        use: primary
        firstTime: true
        netMonthlyIncome: { minorUnits: 8400000, currency: SEK }
        grossMonthlyIncome: { minorUnits: 12000000, currency: SEK }
        monthlyDebtPayments: { minorUnits: 0, currency: SEK }
        savings: { minorUnits: 120000000, currency: SEK }
    expect:
      tools_allowed: [compute_affordability, propose_scenario, load_market]
      market: SE
      components_include:
        [
          AffordabilitySummary,
          AmountSlider,
          PaymentBreakdown,
          StressTestChart,
          PurchaseCostsTable,
        ]
  - action: commit_scenario
    data:
      scenario:
        price: { minorUnits: 740000000, currency: SEK }
        downPayment: { minorUnits: 120000000, currency: SEK }
    expect:
      tools_allowed:
        [compute_affordability, estimate_purchase_costs, get_obstacles, load_market]
