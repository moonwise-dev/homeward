id: lisbon-city-only
persona: lifestyle-mover
turns:
  - reason: lifestyle
    text: >-
      Reason for the move: a change of lifestyle.

      Moving to: Lisbon.
    expect:
      tools_called: [propose_story]
      tools_allowed: [resolve_market, propose_profile]
      market: PT
      coverage: curated
      components_include: [StoryDraft, LifestyleCommuteMap]
      components_exclude:
        [ChoicePicker, ComparisonTable, AffordabilitySummary]
  - action: commit_story
    data:
      story:
        picks:
          activities: [water]
          evenings: [cafes, quiet]
          gettingAround: [transit]
        mustHaves: [water]
    expect:
      tools_allowed: [propose_story, propose_profile]
      components_include: [LifestyleCommuteMap, ComparisonTable]
