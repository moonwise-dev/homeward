id: lisbon-city-only
persona: lifestyle-mover
buyer:
  adults: 1
  childAges: []
  mode: transit
  maxMinutes: 40
  homeType: flat
  outdoor: balcony
  style: modern
  rooms: 3
  areas: [carcavelos, cascais-estoril, costa-da-caparica]
turns:
  - reason: lifestyle
    text: >-
      Reason for the move: a change of lifestyle.

      Moving to: Lisbon.
    expect:
      tools_called: [propose_story]
      tools_allowed: [resolve_market]
      market: PT
      coverage: curated
      components_exclude:
        [StoryDraft, ComparisonTable, DynamicRecommendationStack, AffordabilitySummary]
  - answer: until_summary
    expect:
      tools_allowed: [propose_story, compare_areas, resolve_market]
      components_exclude: [ComparisonTable, DynamicRecommendationStack]
  - action: commit_story
    data:
      story:
        picks:
          activities: [water]
          evenings: [cafes, quiet]
        mustHaves: [water]
    expect:
      tools_allowed: [propose_story, propose_profile]
      components_include: [LifestyleCommuteMap, DynamicRecommendationStack]
