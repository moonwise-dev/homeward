id: lisbon-city-only
persona: lifestyle-mover
turns:
  - reason: lifestyle
    text: >-
      Reason for the move: a change of lifestyle.

      Moving to: Lisbon.
    expect:
      tools_called: [propose_story]
      tools_allowed: [resolve_market, propose_profile, load_market]
      market: PT
      coverage: curated
      components_exclude: [ComparisonTable, AffordabilitySummary]
  - text: >-
      I work remotely, so no commute. I surf most mornings, I like cafés, and
      I want quiet evenings. No car.
    expect:
      tools_called: [propose_story]
      tools_allowed: [resolve_market, propose_profile, load_market]
      market: PT
      coverage: curated
      components_include: [ChoicePicker]
      components_exclude: [ComparisonTable, AffordabilitySummary]
  - action: commit_story
    data:
      story:
        mustHaves: [water]
    expect:
      tools_allowed: [propose_story, load_market, propose_profile]
      components_include: [LifestyleCommuteMap, ComparisonTable]
