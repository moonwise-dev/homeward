id: madeira-resident-contrast
persona: resident
deal: true
turns:
  - text: >-
      I already live in Funchal and pay tax in Portugal. I am looking at a
      350 000 euro flat as my main home
    expect:
      tools_called: [resolve_market, load_market]
      tools_allowed: [propose_profile, propose_scenario, get_obstacles]
      market: PT-30
      coverage: curated
      components_include: [MarketSnapshotCard]
      components_exclude: [ForeignBuyerObstacles]
  - action: commit_profile
    data:
      profile:
        age: 38
        borrowers: 1
        adults: 1
        childAges: []
        employment: employed
        citizenship: PT
        taxResidence: PT
        formerResident: true
        residencyIntent: stayResident
        use: primary
        netMonthlyIncome: { minorUnits: 320000, currency: EUR }
        monthlyDebtPayments: { minorUnits: 0, currency: EUR }
        savings: { minorUnits: 12000000, currency: EUR }
    expect:
      tools_allowed:
        [compute_affordability, propose_scenario, estimate_purchase_costs, get_obstacles, load_market]
      market: PT-30
      components_include: [AffordabilitySummary, AmountSlider]
      components_exclude: [ForeignBuyerObstacles]
